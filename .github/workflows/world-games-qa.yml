name: World Games browser QA
on:
  pull_request:
    paths:
      - 'src/components/world-games/**'
      - 'src/utils/worldGame*.js'
      - 'src/components/world-learning/WorldAdventureHome.jsx'
      - 'src/App.jsx'
      - 'scripts/qa-world-games-browser.mjs'
      - 'tests/worldGameEngine.test.mjs'
      - 'tests/worldGameLanguage.test.mjs'
      - 'tests/worldGameAiaAuthoring.test.mjs'
      - 'scripts/qa-aia-bilingual.mjs'
      - 'docs/aia-refresh/**'
      - 'tests/worldBattleRoom.test.mjs'
      - 'src/utils/worldBattleRoom.js'
      - 'src/data/world-games/**'
      - '.github/workflows/world-games-qa.yml'
permissions:
  contents: read
jobs:
  world-games:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test tests/worldGameEngine.test.mjs tests/worldBattleRoom.test.mjs tests/worldGameLanguage.test.mjs tests/worldGameAiaAuthoring.test.mjs
      - run: node scripts/qa-aia-bilingual.mjs --plan
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-world-games-browser.mjs
