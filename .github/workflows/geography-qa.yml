name: Geography and Creator QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/geography/**'
      - 'api/**'
      - 'lib/**'
      - 'gas/**'
      - 'cloudflare/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/geography-qa.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Require completed country content reviews (blocks while pending)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run qa:geography
      - run: npm run qa:images
      - run: npm run qa:assets
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - if: inputs.release == true
        run: npm run qa:release
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geography-qa
          path: docs/qa
          retention-days: 7
